<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4C32B8" />
    <meta name="description" content="VIOLETBANK — simulation bancaire entièrement fictive : argent, cartes et crédits de démonstration." />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <title>VIOLETBANK — Simulation bancaire</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash clair/sombre.
      try {
        var s = JSON.parse(localStorage.getItem('violetbank-demo:v1') || 'null');
        var t = (s && s.settings && s.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VIOLETBANK nécessite JavaScript. Simulation bancaire — argent et crédits fictifs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
